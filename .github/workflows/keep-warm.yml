name: keep-warm

# Pings the Render service so it never idles into a 15-min spin-down (which
# would cost a real visitor a ~50s cold start). GitHub cron can be delayed
# under load, so each run fires several pings a couple of minutes apart to
# keep coverage dense between runs. Free — runs on GitHub's minutes.
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum)
  workflow_dispatch: {}       # manual trigger button too

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping /health a few times
        run: |
          URL="https://sastaspeech.in/health"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 70 "$URL" || echo "000")
            echo "ping $i -> HTTP $code at $(date -u +%H:%M:%S)"
            [ "$i" -lt 3 ] && sleep 90
          done
